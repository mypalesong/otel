<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#111827"/>

  <!-- Title -->
  <text x="400" y="40" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">OpenTelemetry Enterprise Benefits</text>

  <!-- Card 1: MTTR -->
  <g transform="translate(40, 70)">
    <rect width="160" height="200" rx="15" fill="url(#card1)"/>
    <text x="80" y="50" fill="white" font-family="Arial" font-size="36" text-anchor="middle">⏱️</text>
    <text x="80" y="85" fill="white" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">MTTR 감소</text>
    <text x="80" y="130" fill="white" font-family="Arial" font-size="42" font-weight="bold" text-anchor="middle">52%</text>
    <text x="80" y="160" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">평균 복구 시간</text>
    <text x="80" y="180" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">대폭 단축</text>
  </g>

  <!-- Card 2: Adoption -->
  <g transform="translate(230, 70)">
    <rect width="160" height="200" rx="15" fill="url(#card2)"/>
    <text x="80" y="50" fill="white" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
    <text x="80" y="85" fill="white" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">도입 성장</text>
    <text x="80" y="130" fill="white" font-family="Arial" font-size="42" font-weight="bold" text-anchor="middle">45%</text>
    <text x="80" y="160" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">YoY 코드 커밋</text>
    <text x="80" y="180" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">증가율</text>
  </g>

  <!-- Card 3: Cost Savings -->
  <g transform="translate(420, 70)">
    <rect width="160" height="200" rx="15" fill="url(#card3)"/>
    <text x="80" y="50" fill="white" font-family="Arial" font-size="36" text-anchor="middle">💰</text>
    <text x="80" y="85" fill="white" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">비용 절감</text>
    <text x="80" y="130" fill="white" font-family="Arial" font-size="42" font-weight="bold" text-anchor="middle">60%</text>
    <text x="80" y="160" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">관측성 비용</text>
    <text x="80" y="180" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">최대 절감</text>
  </g>

  <!-- Card 4: Contributors -->
  <g transform="translate(610, 70)">
    <rect width="160" height="200" rx="15" fill="url(#card4)"/>
    <text x="80" y="50" fill="white" font-family="Arial" font-size="36" text-anchor="middle">👥</text>
    <text x="80" y="85" fill="white" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">커뮤니티</text>
    <text x="80" y="125" fill="white" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle">10K+</text>
    <text x="80" y="160" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">글로벌 기여자</text>
    <text x="80" y="180" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">1,200+ 기업</text>
  </g>

  <!-- Footer -->
  <text x="400" y="310" fill="#9ca3af" font-family="Arial" font-size="12" text-anchor="middle">* 150개 엔터프라이즈 배포 연구 결과 (NAJER, 2024)</text>
  <text x="400" y="330" fill="#6b7280" font-family="Arial" font-size="10" text-anchor="middle">eBay, GitHub, Shopify, Skyscanner 등 글로벌 기업 도입</text>
</svg>
