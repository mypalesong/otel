<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="tracesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metricsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="logsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">OpenTelemetry Three Signals</text>

  <!-- Traces -->
  <g transform="translate(80, 70)">
    <rect width="180" height="180" rx="20" fill="url(#tracesGrad)" filter="url(#glow)"/>
    <text x="90" y="50" fill="white" font-family="Arial" font-size="40" text-anchor="middle">🔍</text>
    <text x="90" y="90" fill="white" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Traces</text>
    <text x="90" y="115" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">분산 요청 추적</text>
    <text x="90" y="140" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• Span 기반 추적</text>
    <text x="90" y="158" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• 서비스 간 연결</text>
    <text x="90" y="176" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• 지연 시간 분석</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(310, 70)">
    <rect width="180" height="180" rx="20" fill="url(#metricsGrad)" filter="url(#glow)"/>
    <text x="90" y="50" fill="white" font-family="Arial" font-size="40" text-anchor="middle">📊</text>
    <text x="90" y="90" fill="white" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Metrics</text>
    <text x="90" y="115" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">시스템 측정 지표</text>
    <text x="90" y="140" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• Counter, Gauge</text>
    <text x="90" y="158" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• Histogram</text>
    <text x="90" y="176" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• 실시간 모니터링</text>
  </g>

  <!-- Logs -->
  <g transform="translate(540, 70)">
    <rect width="180" height="180" rx="20" fill="url(#logsGrad)" filter="url(#glow)"/>
    <text x="90" y="50" fill="white" font-family="Arial" font-size="40" text-anchor="middle">📝</text>
    <text x="90" y="90" fill="white" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Logs</text>
    <text x="90" y="115" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11" text-anchor="middle">이벤트 기록</text>
    <text x="90" y="140" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• 구조화된 로그</text>
    <text x="90" y="158" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• Trace 컨텍스트 연결</text>
    <text x="90" y="176" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="10" text-anchor="middle">• 디버깅 정보</text>
  </g>

  <!-- Connecting lines -->
  <path d="M 260 160 Q 310 130 310 160" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 490 160 Q 540 130 540 160" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>

  <!-- Footer -->
  <text x="400" y="280" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">상호 연결된 세 가지 시그널로 완전한 관측성 확보</text>
</svg>
