<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sidecarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="collGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#be185d"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#0c0a20"/>

  <!-- Title -->
  <text x="450" y="35" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">MSA Observability with OpenTelemetry</text>

  <!-- Kubernetes cluster boundary -->
  <rect x="30" y="55" width="840" height="340" rx="15" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="60" y="80" fill="#9ca3af" font-family="Arial" font-size="12">Kubernetes Cluster</text>

  <!-- Service 1 Pod -->
  <g transform="translate(60, 100)" filter="url(#dropShadow)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="90" y="25" fill="#94a3b8" font-family="Arial" font-size="10" text-anchor="middle">Pod</text>
    <rect x="15" y="40" width="70" height="60" rx="8" fill="url(#serviceGrad)"/>
    <text x="50" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Order</text>
    <text x="50" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Service</text>
    <rect x="95" y="40" width="70" height="60" rx="8" fill="url(#sidecarGrad)"/>
    <text x="130" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">OTel</text>
    <text x="130" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Agent</text>
  </g>

  <!-- Service 2 Pod -->
  <g transform="translate(280, 100)" filter="url(#dropShadow)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="90" y="25" fill="#94a3b8" font-family="Arial" font-size="10" text-anchor="middle">Pod</text>
    <rect x="15" y="40" width="70" height="60" rx="8" fill="url(#serviceGrad)"/>
    <text x="50" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Payment</text>
    <text x="50" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Service</text>
    <rect x="95" y="40" width="70" height="60" rx="8" fill="url(#sidecarGrad)"/>
    <text x="130" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">OTel</text>
    <text x="130" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Agent</text>
  </g>

  <!-- Service 3 Pod -->
  <g transform="translate(500, 100)" filter="url(#dropShadow)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="90" y="25" fill="#94a3b8" font-family="Arial" font-size="10" text-anchor="middle">Pod</text>
    <rect x="15" y="40" width="70" height="60" rx="8" fill="url(#serviceGrad)"/>
    <text x="50" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Inventory</text>
    <text x="50" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Service</text>
    <rect x="95" y="40" width="70" height="60" rx="8" fill="url(#sidecarGrad)"/>
    <text x="130" y="65" fill="white" font-family="Arial" font-size="9" text-anchor="middle">OTel</text>
    <text x="130" y="80" fill="white" font-family="Arial" font-size="9" text-anchor="middle">Agent</text>
  </g>

  <!-- Arrows between services -->
  <path d="M 240 160 L 280 160" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 160 L 500 160" stroke="#60a5fa" stroke-width="2" fill="none"/>

  <!-- Arrows to Collector -->
  <path d="M 150 220 L 150 280 L 350 280" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M 370 220 L 370 260 L 370 280" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M 590 220 L 590 280 L 400 280" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="5,3"/>

  <!-- OTel Collector -->
  <g transform="translate(270, 280)" filter="url(#dropShadow)">
    <rect width="200" height="80" rx="12" fill="url(#collGrad)"/>
    <text x="100" y="30" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">OTel Collector</text>
    <text x="100" y="50" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="10" text-anchor="middle">Gateway Mode</text>
    <text x="100" y="68" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="9" text-anchor="middle">Sampling • Batching • Export</text>
  </g>

  <!-- Backends -->
  <g transform="translate(720, 90)" filter="url(#dropShadow)">
    <rect width="130" height="50" rx="8" fill="#0ea5e9"/>
    <text x="65" y="30" fill="white" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Jaeger</text>
  </g>
  <g transform="translate(720, 160)" filter="url(#dropShadow)">
    <rect width="130" height="50" rx="8" fill="#f97316"/>
    <text x="65" y="30" fill="white" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Prometheus</text>
  </g>
  <g transform="translate(720, 230)" filter="url(#dropShadow)">
    <rect width="130" height="50" rx="8" fill="#22c55e"/>
    <text x="65" y="30" fill="white" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Loki</text>
  </g>

  <!-- Arrow from Collector to backends -->
  <path d="M 470 320 L 720 170" stroke="#f472b6" stroke-width="2" fill="none"/>

  <!-- Grafana -->
  <g transform="translate(720, 310)" filter="url(#dropShadow)">
    <rect width="130" height="60" rx="8" fill="#FF6B35"/>
    <text x="65" y="25" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Grafana</text>
    <text x="65" y="45" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="10" text-anchor="middle">📊 Dashboard</text>
  </g>

  <!-- Arrows from backends to Grafana -->
  <path d="M 785 140 L 785 310" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M 785 210 L 785 310" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M 785 280 L 785 310" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>

  <!-- Legend -->
  <g transform="translate(60, 400)">
    <rect width="15" height="15" rx="3" fill="url(#serviceGrad)"/>
    <text x="25" y="12" fill="#94a3b8" font-family="Arial" font-size="10">Application</text>
    <rect x="120" width="15" height="15" rx="3" fill="url(#sidecarGrad)"/>
    <text x="145" y="12" fill="#94a3b8" font-family="Arial" font-size="10">Sidecar Agent</text>
    <rect x="260" width="15" height="15" rx="3" fill="url(#collGrad)"/>
    <text x="285" y="12" fill="#94a3b8" font-family="Arial" font-size="10">Collector</text>
  </g>

  <text x="450" y="430" fill="#6b7280" font-family="Arial" font-size="11" text-anchor="middle">Sidecar Pattern: Each pod has OTel agent for distributed tracing</text>
</svg>
