<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="collectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">OpenTelemetry Data Flow</text>

  <!-- Applications -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="140" height="70" rx="10" fill="url(#appGrad)"/>
    <text x="100" y="110" fill="white" font-family="Arial" font-size="12" text-anchor="middle">🟢 Node.js</text>
    <text x="100" y="130" fill="white" font-family="Arial" font-size="10" text-anchor="middle">OTel SDK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="165" width="140" height="70" rx="10" fill="url(#appGrad)"/>
    <text x="100" y="195" fill="white" font-family="Arial" font-size="12" text-anchor="middle">☕ Java</text>
    <text x="100" y="215" fill="white" font-family="Arial" font-size="10" text-anchor="middle">OTel SDK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="250" width="140" height="70" rx="10" fill="url(#appGrad)"/>
    <text x="100" y="280" fill="white" font-family="Arial" font-size="12" text-anchor="middle">🐍 Python</text>
    <text x="100" y="300" fill="white" font-family="Arial" font-size="10" text-anchor="middle">OTel SDK</text>
  </g>

  <!-- Arrows to Collector -->
  <path d="M 170 115 L 300 200" stroke="#f093fb" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 170 200 L 300 200" stroke="#f093fb" stroke-width="3" fill="none"/>
  <path d="M 170 285 L 300 200" stroke="#f093fb" stroke-width="3" fill="none"/>

  <!-- Collector -->
  <g filter="url(#shadow)">
    <rect x="300" y="120" width="200" height="160" rx="15" fill="url(#collectorGrad)"/>
    <text x="400" y="155" fill="white" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">OTel Collector</text>
    <rect x="320" y="170" width="160" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="400" y="190" fill="white" font-family="Arial" font-size="11" text-anchor="middle">Receivers</text>
    <rect x="320" y="205" width="160" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="400" y="225" fill="white" font-family="Arial" font-size="11" text-anchor="middle">Processors</text>
    <rect x="320" y="240" width="160" height="30" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="400" y="260" fill="white" font-family="Arial" font-size="11" text-anchor="middle">Exporters</text>
  </g>

  <!-- Arrows to Backends -->
  <path d="M 500 160 L 620 100" stroke="#4facfe" stroke-width="3" fill="none"/>
  <path d="M 500 200 L 620 200" stroke="#4facfe" stroke-width="3" fill="none"/>
  <path d="M 500 240 L 620 300" stroke="#4facfe" stroke-width="3" fill="none"/>

  <!-- Backends -->
  <g filter="url(#shadow)">
    <rect x="620" y="60" width="130" height="80" rx="10" fill="url(#backendGrad)"/>
    <text x="685" y="95" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Jaeger</text>
    <text x="685" y="115" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Traces</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="160" width="130" height="80" rx="10" fill="url(#backendGrad)"/>
    <text x="685" y="195" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Tempo</text>
    <text x="685" y="215" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Traces</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="260" width="130" height="80" rx="10" fill="url(#backendGrad)"/>
    <text x="685" y="295" fill="white" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Prometheus</text>
    <text x="685" y="315" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Metrics</text>
  </g>

  <!-- Arrow to Grafana -->
  <path d="M 750 100 L 800 200" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <path d="M 750 200 L 800 200" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <path d="M 750 300 L 800 200" stroke="#00f2fe" stroke-width="2" fill="none"/>

  <!-- Grafana -->
  <g filter="url(#shadow)">
    <rect x="800" y="150" width="80" height="100" rx="10" fill="#FF6B35"/>
    <text x="840" y="195" fill="white" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Grafana</text>
    <text x="840" y="215" fill="white" font-family="Arial" font-size="9" text-anchor="middle">📊</text>
  </g>

  <!-- Legend -->
  <text x="450" y="380" fill="#888" font-family="Arial" font-size="11" text-anchor="middle">Applications → Collector → Backends → Visualization</text>
</svg>
